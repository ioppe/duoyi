<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>底部弹窗展开与收回验证</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f5f6f8;color:#242c38;margin:0;padding:32px}main{max-width:1500px;margin:auto}h1{font-size:26px}p{max-width:900px;color:#58616d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}figure{margin:0;padding:14px;background:white;border:1px solid #dde1e8;border-radius:14px}img{display:block;width:100%;height:auto}figcaption{margin-top:12px;font-weight:600}.wide{margin-top:24px}.wide img{max-height:1000px;object-fit:contain}a{color:#9b4045}</style></head><body><main><h1>底部弹窗：浏览时展开，到顶后再次拉动收回</h1><p>实际 Flutter Web release 构建。初始高度保留半屏至三分之二屏，向下浏览内容后展开到可用整页；返回内容顶部后保持展开，再次反向拉动才收回。输入和选择在切换中保留。</p><p><a href="README.md">验证记录</a></p><div class="grid"><figure><img src="01-habit-initial-490.png" alt="新建习惯初始高度"><figcaption>1. 新建习惯初始高度 · 490×710</figcaption></figure><figure><img src="02-habit-expanded-490.png" alt="浏览内容后展开"><figcaption>2. 浏览内容后整页展开</figcaption></figure><figure><img src="03-habit-top-expanded-490.png" alt="返回顶部仍保持展开"><figcaption>3. 返回内容顶部，保持展开</figcaption></figure><figure><img src="04-habit-collapsed-490.png" alt="再次反向拉动收回"><figcaption>4. 再次反向拉动，回到初始高度</figcaption></figure><figure><img src="05-habit-input-retained-490.png" alt="展开与收回后输入仍保留"><figcaption>5. 输入保留，保存可到达</figcaption></figure><figure><img src="06-todo-expanded-320.png" alt="窄屏新建待办整页展开"><figcaption>6. 窄屏待办表单 · 320×720</figcaption></figure></div><figure class="wide"><img src="07-comparison.png" alt="初始、整页顶部和收回的同尺寸对比"><figcaption>初始 → 整页顶部 → 收回；三张原始截图等比例并排</figcaption></figure></main></body></html>
