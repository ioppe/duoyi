<p>以下均为实际 Flutter 页面截图。输入框常规 56px，字段间距 16px，主按钮前 24px；登录与注册继续等高翻转，卡片内部没有纵向滚动。</p>
<div class="pair">
<figure><figcaption>登录 · 强制邮箱注册策略</figcaption><img src="01-login-email-policy-390.png" alt="连续排版的登录卡片，密码输入后紧接登录按钮"></figure>

</div>

<figure><figcaption>修改后 · 表单连续居中</figcaption><img src="01-login-email-policy-390.png" alt="新登录卡片使用24px按钮间距"></figure>
</div>
