<?xml version="1.0" encoding="UTF-8"?>
<!--
  多仪 canonical application logo (single source of truth for every client).

  Authored 1:1 from the user-confirmed reference artboard: a pure red rounded
  square with the white "space dashboard" glyph made of three geometric blocks.
  Every platform icon PNG and the auth-page logo tile are rendered from this
  file by scripts/sync_app_icons.py, so the geometry and palette below must not
  drift:

    canvas      88 x 88 units, background #F6F7F9
    brand tile  0,0 .. 88,88 with corner radius 32, fill #C85656
    glyph       Material Icons F01AF (space_dashboard_rounded), units 512,
                bounds 64,64 .. 448,448, mapped by translate(20 68) scale(.09375 -.09375)
                so the 36-unit glyph sits centred at 26,26 .. 62,62

  The floating reference screenshot is kept byte-for-byte next to this file as
  duoyi_logo_reference.png (audit only, never rendered by the sync script).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 88 88">
  <rect x="0" y="0" width="88" height="88" fill="#F6F7F9"/>
  <rect x="0" y="0" width="88" height="88" rx="32" fill="#C85656"/>
  <path fill="#FFFFFF" transform="translate(20 68) scale(0.09375 -0.09375)" d="M192 64H107C83 64 64 83 64 107V405C64 429 83 448 107 448H192C215 448 235 429 235 405V107C235 83 215 64 192 64ZM320 64H405C429 64 448 83 448 107V213C448 237 429 256 405 256H320C297 256 277 237 277 213V107C277 83 297 64 320 64ZM448 341V405C448 429 429 448 405 448H320C297 448 277 429 277 405V341C277 318 297 299 320 299H405C429 299 448 318 448 341Z"/>
</svg>
