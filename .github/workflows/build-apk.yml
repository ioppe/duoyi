name: build

on:
  push:
    branches: [main, self-hosted-skydrow, fix/android-input-settings-device-test]
    tags: ['v*']
  pull_request:
    branches: [main, self-hosted-skydrow]
  workflow_dispatch:
    inputs:
      server_url:
        description: '覆盖后端地址；留空使用部署配置'
        required: false
        default: ''
      build_web:
        description: '是否同时构建 web 产物'
        required: false
        default: 'false'
      config_file:
        description: '公开部署配置文件'
        type: string
        default: 'config/deployment.json'
      same_origin:
        description: '显式使用空后端地址（Web 同源模式）'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.config.outputs.profile }}
      flutter_version: ${{ steps.config.outputs.flutter_version }}
      java_version: ${{ steps.config.outputs.java_version }}
      python_version: ${{ steps.config.outputs.python_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public deployment and toolchain configuration
        id: config
        env:
          PROFILE_FILE: ${{ github.event.inputs.config_file || 'config/deployment.json' }}
          SERVER_URL_OVERRIDE: ${{ github.event.inputs.server_url || vars.DUOYI_SERVER_URL || '' }}
          UPDATE_REPOSITORY_OVERRIDE: ${{ vars.DUOYI_UPDATE_REPOSITORY || '' }}
          WEB_BASE_HREF_OVERRIDE: ${{ vars.DUOYI_WEB_BASE_HREF || '' }}
          SAME_ORIGIN: ${{ github.event.inputs.same_origin || 'false' }}
        run: |
          if [ -n "$SERVER_URL_OVERRIDE" ]; then export DUOYI_SERVER_URL="$SERVER_URL_OVERRIDE"; fi
          if [ "$SAME_ORIGIN" = 'true' ]; then export DUOYI_SERVER_URL=''; fi
          if [ -n "$UPDATE_REPOSITORY_OVERRIDE" ]; then export DUOYI_UPDATE_REPOSITORY="$UPDATE_REPOSITORY_OVERRIDE"; fi
          if [ -n "$WEB_BASE_HREF_OVERRIDE" ]; then export DUOYI_WEB_BASE_HREF="$WEB_BASE_HREF_OVERRIDE"; fi
          python3 scripts/project_config.py --config "$PROFILE_FILE" workflow --output "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 1. Analyze & test
  # ─────────────────────────────────────────────
  analyze:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: ${{ needs.configuration.outputs.flutter_version }}
      JAVA_VERSION: ${{ needs.configuration.outputs.java_version }}
      DUOYI_BUILD_PROFILE: ${{ needs.configuration.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.configuration.outputs.python_version }}
      - name: Install validated public build profile
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          profile = Path(os.environ['RUNNER_TEMP']) / 'duoyi-deployment.json'
          profile.write_text(json.dumps(json.loads(os.environ['DUOYI_BUILD_PROFILE'])))
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'DUOYI_CONFIG_FILE={profile}\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (if any)
        run: |
          if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
            python3 scripts/flutter_with_config.py test --no-pub
          else
            echo "No tests found, skipping."
          fi

      - name: Run backend tests
        run: |
          export DUOYI_DB_PATH="$RUNNER_TEMP/duoyi-test-bootstrap.db"
          export DUOYI_ENV_FILE=''
          export APP_UPDATE_REPOSITORY=''
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend

  # ─────────────────────────────────────────────
  # 2. Android APK / AAB
  # ─────────────────────────────────────────────
  android:
    needs: [analyze, configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: ${{ needs.configuration.outputs.flutter_version }}
      JAVA_VERSION: ${{ needs.configuration.outputs.java_version }}
      DUOYI_BUILD_PROFILE: ${{ needs.configuration.outputs.profile }}
      HAS_KEYSTORE: ${{ secrets.DUOYI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.configuration.outputs.python_version }}
      - name: Install validated public build profile
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          profile = Path(os.environ['RUNNER_TEMP']) / 'duoyi-deployment.json'
          profile.write_text(json.dumps(json.loads(os.environ['DUOYI_BUILD_PROFILE'])))
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'DUOYI_CONFIG_FILE={profile}\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      # Only restore real keystore when the secret is present.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DUOYI_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.DUOYI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DUOYI_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DUOYI_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keys/duoyi-release.jks
          {
            printf 'storeFile=keys/duoyi-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PWD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PWD"
          } > android/key.properties
          echo "Keystore restored."

      - name: Require release keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::DUOYI_KEYSTORE_BASE64 missing; refusing to build release artifacts with debug signing."
          exit 1

      - name: Build APK (release, split per ABI)
        run: python3 scripts/flutter_with_config.py build apk --release --split-per-abi

      - name: Build universal APK (release)
        run: python3 scripts/flutter_with_config.py build apk --release

      - name: Build App Bundle (release, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/flutter_with_config.py build appbundle --release

      - name: Stage artifacts
        id: stage
        run: |
          mkdir -p artifacts
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF##refs/tags/}"
          else
            SUFFIX="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "Suffix: $SUFFIX"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "artifacts/duoyi-$SUFFIX.apk"
          fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            SRC="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "artifacts/duoyi-$SUFFIX-$abi.apk"
            fi
          done
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "artifacts/duoyi-$SUFFIX.aab"
          fi

          ls -lh artifacts

      - name: Print signing fingerprint
        run: |
          APK="$(ls artifacts/*.apk 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK" ]; then
            echo "Verifying APK signing identity of $APK:"
            "$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" | grep -E 'SHA256|Owner|Issuer' || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoyi-android
          path: artifacts/*
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/keys/duoyi-release.jks android/key.properties

  # ─────────────────────────────────────────────
  # 3. Web (optional)
  # ─────────────────────────────────────────────
  web:
    needs: [analyze, configuration]
    if: >
      github.ref == 'refs/heads/main'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_web == 'true')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_VERSION: ${{ needs.configuration.outputs.flutter_version }}
      DUOYI_BUILD_PROFILE: ${{ needs.configuration.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.configuration.outputs.python_version }}
      - name: Install validated public build profile
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          profile = Path(os.environ['RUNNER_TEMP']) / 'duoyi-deployment.json'
          profile.write_text(json.dumps(json.loads(os.environ['DUOYI_BUILD_PROFILE'])))
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'DUOYI_CONFIG_FILE={profile}\n')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      - name: Build web (release)
        run: |
          rm -rf build/web build/web-desktop build/web-mobile
          python3 scripts/flutter_with_config.py build web --release --dart-define=DUOYI_WEB_TARGET=desktop
          mv build/web build/web-desktop
          python3 scripts/flutter_with_config.py build web --release --dart-define=DUOYI_WEB_TARGET=mobile
          mv build/web build/web-mobile

      - name: Package web
        run: |
          rm -rf web-artifacts
          mkdir -p web-artifacts
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF##refs/tags/}"
          else
            SUFFIX="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          tar -czf "web-artifacts/duoyi-web-$SUFFIX.tar.gz" -C build/web-desktop .
          tar -czf "web-artifacts/duoyi-web-desktop-$SUFFIX.tar.gz" -C build/web-desktop .
          tar -czf "web-artifacts/duoyi-web-mobile-$SUFFIX.tar.gz" -C build/web-mobile .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoyi-web
          path: web-artifacts/*
          retention-days: 30

      - name: Build GitHub Pages with its own base path
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_HREF: ${{ vars.DUOYI_PAGES_BASE_HREF || '' }}
        run: |
          PAGES_PATH="${PAGES_BASE_HREF:-/${GITHUB_REPOSITORY#*/}/}"
          python3 scripts/flutter_with_config.py build web --release --base-href="$PAGES_PATH" --dart-define=DUOYI_WEB_TARGET=desktop
          mv build/web build/web-pages

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-pages

  # ─────────────────────────────────────────────
  # 4. GitHub Pages (main branch only)
  # ─────────────────────────────────────────────
  deploy-pages:
    needs: web
    if: github.ref == 'refs/heads/main' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # 5. Release (tag push only)
  # ─────────────────────────────────────────────
  release:
    needs: [android, web]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: duoyi-android
          path: dist

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: duoyi-web
          path: dist

      - name: List artifacts
        run: ls -R dist

      - name: Resolve release notes
        id: release_notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "No release notes found for $TAG; generated notes will be used."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: true
          fail_on_unmatched_files: false
